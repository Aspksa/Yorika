name: Chat memory safety

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'scripts/chat-store.py'
      - 'scripts/sqlite_*.py'
      - 'docs/SQLITE_*.md'
      - 'backend/storage.py'
      - 'www/avatar.js'
      - 'tests/**'
      - '.github/workflows/chat-memory-tests.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate task checkboxes
        run: python scripts/check-plan.py
      - name: JavaScript syntax
        run: node --check www/avatar.js
      - name: PowerShell syntax on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/yorika-tray.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
