name: Neural Engine real PyTorch smoke
on:
  pull_request:
    paths:
      - 'backend/neural_*.py'
      - 'backend/training_engine.py'
      - 'backend/continual_learning.py'
      - 'tests/test_continual_learning.py'
      - 'tests/test_neural_adaptive.py'
      - '.github/workflows/neural-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-infer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run real training and inference
        run: python -m backend.neural_smoke --steps 2
      - name: Compare two actual candidates on held-out synthetic data
        run: PYTHONPATH=. python scripts/compare-neural-candidates.py
      - name: Train and preserve two different architecture checkpoints in isolated CPU lab
        run: PYTHONPATH=. python scripts/verify-neural-lab.py
      - name: Verify genuine checkpoint weight continuation with optimizer reset
        run: PYTHONPATH=. python scripts/verify-neural-resume.py
      - name: Prove bitwise-equivalent resumed native model training
        run: PYTHONPATH=. python scripts/verify-neural-exact-resume.py
      - name: Verify periodic checkpoint crash recovery
        run: PYTHONPATH=. python scripts/verify-neural-longrun.py
      - name: Verify deterministic Russian BPE tokenizer
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_bpe_v1.py' -v
      - name: Verify review-gated multi-session GPU campaign on CPU fixture
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_long_cuda_campaign.py' -v
      - name: Guard cross-device checkpoint resume
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_device_resume.py' -v
      - name: Test explicit GPU training path and CPU regression
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_cuda_training.py' -v
      - name: Check truthful CUDA hardware diagnostics without GPU runner
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_cuda_probe.py' -v
      - name: Reject unsupported corpus GPU and dialogue completion claims
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_language_readiness.py' -v
      - name: Verify budgeted training and safe resume
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_training_budget.py' -v
      - name: Verify locked final heldout test scoring and corpus lineage
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_final_language_test.py' -v
      - name: Run consented single-brain training experiment end-to-end
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_language_experiment_runner.py' -v
      - name: Verify validation-selected best checkpoint survives exact resume
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_best_checkpoint.py' -v
      - name: Compare BPE generations on locked independent test data
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_language_benchmark.py' -v
      - name: Check scaled Transformer and resumable training
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_scale_v1.py' -v
      - name: Test language BPE v2 using actual CPU PyTorch
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_neural_language_bpe_v2.py' -v
      - name: Train Russian UTF-8 language brain and evaluate held-out NLL
        run: PYTHONPATH=. python scripts/verify-language-brain.py

      - name: Verify continual weight consolidation and offline adaptive architecture
        run: |
          PYTHONPATH=. OMP_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_continual_learning.py' -v
          PYTHONPATH=. OMP_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_neural_adaptive.py' -v
