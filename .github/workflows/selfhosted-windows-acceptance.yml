name: Yorika trusted Windows self-hosted acceptance

# This workflow intentionally never runs on PRs or pushes. Only start it
# manually from main after reviewing the code. A self-hosted runner executes
# arbitrary repository code with the privileges of its Windows account.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorika-selfhosted-acceptance
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.repository == 'Aspksa/Yorika'
    runs-on: [self-hosted, Windows, X64, yorika-ci]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed main without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: 'Диагностика Windows runner на русском'
        run: |
          & ./scripts/diagnose-windows-runner.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows runner не готов, откройте yorika-windows-diagnostics.json' }
      - name: 'Удалить прошлый отчёт перед проверками'
        run: |
          $old = Join-Path $env:LOCALAPPDATA 'YorikaTestReports/yorika-portable-acceptance.json'
          if (Test-Path $old) { Remove-Item -LiteralPath $old -Force }
      - name: Check changed files
        run: |
          & './ЦЕНТР_YORIKA/check-changes.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Changed-file check failed' }
      - name: Portable Python and SQLite acceptance
        run: |
          & './ЦЕНТР_YORIKA/test-yorika.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Acceptance failed' }
      - name: PowerShell syntax validation
        run: |
          & ./scripts/check-powershell.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell parse failed' }
      - name: JavaScript syntax validation
        run: |
          node --check www/avatar.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
      - name: DPAPI and updater tests
        run: |
          & './ЦЕНТР_YORIKA/python312-runtime/python.exe' -m unittest discover -s tests -p 'test_windows_dpapi.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI tests failed' }
          & ./scripts/test-updater.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
      - name: Copy acceptance report
        if: always()
        run: |
          $f = Join-Path $env:LOCALAPPDATA 'YorikaTestReports/yorika-portable-acceptance.json'
          if (Test-Path $f) { Copy-Item $f 'yorika-acceptance.json' -Force }
      - name: 'Русский итог в GitHub'
        if: always()
        run: |
          $f = Join-Path $env:LOCALAPPDATA 'YorikaTestReports/yorika-portable-acceptance.json'
          $report = 'ОТЧЁТ_YORIKA.md'
          $python = Join-Path $PWD 'ЦЕНТР_YORIKA/python312-runtime/python.exe'
          if (Test-Path $python) {
            & $python scripts/ci-report-ru.py --input $f --output $report
            if ($LASTEXITCODE -ne 0) { Write-Warning 'Есть непройденные проверки (см. русский отчёт).' }
          } else {
            '# Отчёт Yorika' | Set-Content $report -Encoding UTF8
            '❌ Python не был подготовлен; приёмка не выполнена.' | Add-Content $report -Encoding UTF8
            if ($env:GITHUB_STEP_SUMMARY) { Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8 }
          }
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yorika-selfhosted-acceptance
          path: |
            yorika-acceptance.json
            ОТЧЁТ_YORIKA.md
            yorika-windows-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
