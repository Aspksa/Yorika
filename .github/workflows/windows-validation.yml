name: Windows PowerShell validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    # Linux runner: cheaper than Windows and still catches PowerShell syntax errors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          & ./scripts/check-powershell.ps1 *>&1 | Tee-Object -FilePath powershell-parse.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload parse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parse-linux
          path: powershell-parse.log
          if-no-files-found: ignore
          retention-days: 7
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          & .\scripts\check-powershell.ps1 *>&1 | Tee-Object -FilePath powershell-parse.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cloud.ru DPAPI Windows tests
        run: python -m unittest discover -s tests -p 'test_*cloud*.py' -v
      - name: DPAPI restart acceptance
        run: python -m unittest discover -s tests -p 'test_windows_dpapi.py' -v
      - name: Cloud.ru settings and response syntax
        run: python -m compileall -q backend scripts tests
      - name: Validate updater settings response
        shell: powershell
        run: |
          $text = & .\scripts\update-engine.ps1 -Action settings
          $settings = $text | ConvertFrom-Json
          if ($settings.channel -notin @('fresh','stable')) { throw 'Invalid channel' }
          if ($settings.interval -notin @(0,3600000,86400000)) { throw 'Invalid interval' }
      - name: Run isolated updater tests
        shell: powershell
        run: |
          & .\scripts\test-updater.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload Windows parse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parse-windows
          path: powershell-parse.log
          if-no-files-found: ignore
          retention-days: 7
